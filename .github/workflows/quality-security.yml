name: Quality and security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      NX_DAEMON: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install pinned package manager
        run: npm install --global pnpm@12.4.2
      - name: Install locked dependencies
        id: install
        run: pnpm install --frozen-lockfile
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm nx run-many -t lint --parallel=1 --skip-nx-cache
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm nx run-many -t typecheck --parallel=1 --skip-nx-cache
      - name: Production build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm nx run web:build --skip-nx-cache
      - name: Audit all dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm audit --audit-level low
      - name: Audit production dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm audit --prod --audit-level low
